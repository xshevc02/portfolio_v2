    <path class="line" d="M42 528h25v-24H42v24zM42 504l12-11 13 11"/>
    <circle class="accent" cx="160" cy="520" r="23"/>
    <path class="line" d="M160 509v22M149 520h22"/>
    <path class="line" d="M241 528c2-18 31-18 33 0M257 502a13 13 0 110 26 13 13 0 010-26z"/>
  </g>

  <!-- Settings screen -->
  <g transform="translate(1110 148)">
    <text x="0" y="-28" class="label">Settings</text>
    <rect class="phone" x="0" y="0" width="320" height="560" rx="34"/>
    <rect class="soft" x="24" y="28" width="272" height="1"/>
    <text x="32" y="58" class="tiny">12:45</text>
    <path class="line" d="M46 92l-18 18 18 18"/>
    <text x="74" y="116" class="small">Settings</text>
