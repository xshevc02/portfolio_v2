<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="760" rx="36" fill="#F8F2F7"/>
  <circle cx="1368" cy="124" r="210" fill="#F6BBFC" fill-opacity="0.24"/>
  <circle cx="244" cy="650" r="180" fill="#F6BBFC" fill-opacity="0.16"/>

  <style>
    .phone { fill: #fffdfc; stroke: #211d22; stroke-width: 3; }
    .line { stroke: #211d22; stroke-width: 3; stroke-linecap: round; }
    .thin { stroke: #211d22; stroke-width: 2; stroke-linecap: round; }
    .soft { stroke: #211d22; stroke-opacity: .28; stroke-width: 2; stroke-linecap: round; }
    .label { fill: #211d22; font: 700 25px Inter, Arial, sans-serif; letter-spacing: -.02em; }
    .small { fill: #211d22; font: 500 16px Inter, Arial, sans-serif; opacity: .72; }
    .tiny { fill: #211d22; font: 500 13px Inter, Arial, sans-serif; opacity: .55; }
    .micro { fill: #211d22; font: 600 12px Inter, Arial, sans-serif; opacity: .72; }
    .muted { fill: #211d22; opacity: .16; }
    .accent { fill: #F6BBFC; stroke: #211d22; stroke-width: 2; }
    .chip { fill: #fff; stroke: #211d22; stroke-opacity: .35; stroke-width: 2; }
  </style>

  <text x="170" y="74" class="label">Decision Garden — early mobile wireframes</text>
  <text x="170" y="104" class="small">Redrawn from paper sketches: profile, question detail, and settings flows.</text>

  <!-- Profile screen -->
  <g transform="translate(170 148)">
    <text x="0" y="-28" class="label">Profile</text>
    <rect class="phone" x="0" y="0" width="320" height="560" rx="34"/>
    <rect class="soft" x="24" y="28" width="272" height="1"/>
    <text x="32" y="58" class="tiny">15:20</text>
    <path class="thin" d="M256 54h18m7 0h7"/>

    <circle class="chip" cx="160" cy="126" r="44"/>
    <path class="line" d="M143 135c4-13 14-20 27-20s22 7 27 20"/>
    <circle class="line" cx="160" cy="106" r="12"/>
    <text x="97" y="190" class="small">helped 28 people</text>
    <g transform="translate(94 206)">
      <path d="M10 0l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1 3-7z" fill="#211d22"/>
      <path d="M42 0l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1 3-7z" fill="#211d22"/>
      <path d="M74 0l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1 3-7z" fill="#211d22"/>
      <path d="M106 0l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1 3-7z" fill="#211d22" opacity=".55"/>
    </g>

    <rect class="chip" x="48" y="258" width="224" height="48" rx="12"/>
    <text x="88" y="288" class="small">My saved groups</text>
    <rect class="chip" x="48" y="324" width="224" height="48" rx="12"/>
    <text x="77" y="354" class="small">Archive with questions</text>

    <line class="soft" x1="24" y1="480" x2="296" y2="480"/>
    <path class="line" d="M68 522h30v-28H68v28zM68 494l15-13 15 13"/>
    <circle class="accent" cx="160" cy="508" r="25"/>
    <path class="line" d="M160 496v24M148 508h24"/>
    <path class="line" d="M230 522c2-20 34-20 36 0M248 493a14 14 0 110 28 14 14 0 010-28z"/>
  </g>

  <!-- Question detail screen -->
  <g transform="translate(640 148)">
